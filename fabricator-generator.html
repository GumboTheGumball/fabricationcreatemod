<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Fabricator Recipe Generator</title>
  <style>
    :root {
      --bg: #181a1f;
      --panel: #22262e;
      --border: #343a46;
      --text: #e6e8ec;
      --muted: #9aa3b2;
      --accent: #d9822b;
      --accent-hover: #e5933e;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0; padding: 16px; background: var(--bg); color: var(--text);
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
    }
    @media (max-width: 720px) { body { grid-template-columns: 1fr; } }
    .card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px;
    }
    h2 { margin: 0 0 4px; font-size: 16px; color: var(--accent); }
    label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
    input {
      width: 100%; padding: 8px 10px; border-radius: 6px;
      border: 1px solid var(--border); background: #121418; color: var(--text);
      font-family: ui-monospace, monospace; font-size: 13px;
    }
    .row { display: flex; gap: 8px; align-items: center; }
    button {
      padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border);
      background: #2c313c; color: var(--text); cursor: pointer; font-weight: 600; font-size: 13px;
    }
    button:hover { background: #383e4c; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #121418; }
    button.primary:hover { background: var(--accent-hover); }
    button.danger { color: #ff7b7b; padding: 8px 10px; }
    pre {
      margin: 0; padding: 12px; background: #121418; border: 1px solid var(--border);
      border-radius: 6px; overflow: auto; flex: 1; font-size: 13px; line-height: 1.45;
      font-family: ui-monospace, monospace; color: #a5d6ff;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Create Fabricator Recipe</h2>

    <div>
      <label>Ingredients (Item IDs)</label>
      <div id="ingredients-list" style="display:flex; flex-direction:column; gap:8px;"></div>
      <button type="button" onclick="addIngredient()" style="margin-top:8px;">+ Add Input Item</button>
    </div>

    <div class="row">
      <div style="flex:3;">
        <label>Output Item ID</label>
        <input id="output-id" value="create_fabricator:output_item" oninput="render()" />
      </div>
      <div style="flex:1;">
        <label>Count</label>
        <input id="output-count" type="number" min="1" value="1" oninput="render()" />
      </div>
    </div>

    <div>
      <label>Processing Time (ticks)</label>
      <input id="processing-time" type="number" min="1" value="20480" oninput="render()" />
    </div>
  </div>

  <div class="card">
    <h2>Generated JSON</h2>
    <pre id="json-preview"></pre>
    <div class="row">
      <button class="primary" onclick="copyJson()" id="copy-btn">Copy JSON</button>
      <button onclick="downloadJson()">Download .json</button>
    </div>
  </div>

  <script>
    let ingredients = ["minecraft:input_item_1", "minecraft:input_item_2"];

    function renderInputs() {
      const list = document.getElementById("ingredients-list");
      list.innerHTML = "";
      ingredients.forEach((val, idx) => {
        const row = document.createElement("div");
        row.className = "row";
        row.innerHTML = `
          <input value="${val}" oninput="ingredients[${idx}] = this.value; render();" />
          ${ingredients.length > 1 ? `<button class="danger" onclick="removeIngredient(${idx})">✕</button>` : ""}
        `;
        list.appendChild(row);
      });
      render();
    }

    function addIngredient() {
      ingredients.push("minecraft:stone");
      renderInputs();
    }

    function removeIngredient(idx) {
      ingredients.splice(idx, 1);
      renderInputs();
    }

    function buildRecipe() {
      return {
        type: "create_fabricator:fabricating",
        ingredients: ingredients.filter(i => i.trim()).map(item => ({ item: item.trim() })),
        results: [
          {
            id: document.getElementById("output-id").value.trim() || "create_fabricator:output_item",
            count: Math.max(1, parseInt(document.getElementById("output-count").value, 10) || 1)
          }
        ],
        processingTime: Math.max(1, parseInt(document.getElementById("processing-time").value, 10) || 20480)
      };
    }

    function render() {
      document.getElementById("json-preview").textContent = JSON.stringify(buildRecipe(), null, 2);
    }

    function copyJson() {
      navigator.clipboard.writeText(document.getElementById("json-preview").textContent);
      const btn = document.getElementById("copy-btn");
      btn.textContent = "Copied!";
      setTimeout(() => (btn.textContent = "Copy JSON"), 1500);
    }

    function downloadJson() {
      const data = buildRecipe();
      const rawId = data.results[0].id;
      const fileName = (rawId.includes(":") ? rawId.split(":")[1] : rawId) + ".json";
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = fileName;
      a.click();
    }

    renderInputs();
  </script>
</body>
</html>
